<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e6e2d8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<title>Plan Catedral</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icono.svg" type="image/svg+xml">
<!-- Puerta pública: no tiene datos ni el plan. Después de entrar con tu llave, baja la página privada de tu servidor. -->
<style>
html,body{margin:0;min-height:100%;background:#e6e2d8;color:#151412}
@media (prefers-color-scheme: dark){html,body{background:#151412;color:#f1ede4}}
#puerta{min-height:100vh;display:grid;place-items:center;font:14px/1.4 system-ui,sans-serif;color:#8a8478}
#puerta div{display:grid;justify-items:center;gap:14px}
#puerta svg{width:44px;height:44px;animation:latir 1.4s ease-in-out infinite}
@keyframes latir{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){#puerta svg{animation:none}}
</style></head><body>
<div id="puerta"><div><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M5 30V21A22 22 0 0 1 16 1.95A22 22 0 0 1 27 21V30Z"/><path fill="#e9a21c" d="M11.5 30V22A9 9 0 0 1 16 14.21A9 9 0 0 1 20.5 22V30Z"/></svg><span id="puerta-txt">Abriendo tu plan…</span></div></div>
<script src="servidor.js?v=202611241756"></script>
<script>
(async () => {
  const C = window.catedral, txt = (t) => { const e = document.getElementById("puerta-txt"); if (e) e.textContent = t; };
  if (!C || !C.clave()) { txt(""); C && C.entrar(); return; }
  const cacheLeer = () => { try { return localStorage.getItem("catedral.app"); } catch (e) { return null; } };
  const cacheGuardar = (h) => { try { localStorage.setItem("catedral.app", h); } catch (e) { /* lleno */ } };
  function montar(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    document.body.replaceChildren();
    for (const n of [...doc.head.childNodes]) if (n.nodeName !== "SCRIPT" && n.nodeName !== "TITLE") document.head.appendChild(document.importNode(n, true));
    for (const n of [...doc.body.childNodes]) if (n.nodeName !== "SCRIPT") document.body.appendChild(document.importNode(n, true));
    for (const s of doc.querySelectorAll("script")) { const x = document.createElement("script"); x.textContent = s.textContent; document.body.appendChild(x); }
  }
  let html = null;
  try {
    const j = await Promise.race([C.app(), new Promise((_, mal) => setTimeout(() => mal(new Error("lento")), 8000))]);
    html = j.html; cacheGuardar(html);
  } catch (e) {
    if (e && e.code === "not_granted") return; // servidor.js ya muestra «Entrar»
    html = cacheLeer();
    if (!html) { txt("No pude abrir tu plan. Revisa la conexión y recarga."); return; }
  }
  montar(html);
})();
</script>
</body></html>
